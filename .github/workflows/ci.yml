name: CI

on:
  pull_request:
  push:
    branches: [main]

env:
  CI: true
  DATABASE_URL: postgresql://checkout:checkout_dev@localhost:55432/checkoutv3?schema=public
  REDIS_URL: redis://localhost:56379

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.32.1
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  smoke:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: checkout
          POSTGRES_PASSWORD: checkout_dev
          POSTGRES_DB: checkoutv3
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U checkout -d checkoutv3"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.32.1
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @checkout/contracts build
      - run: pnpm --filter @checkout/db build
      - run: pnpm --filter @checkout/ui build
      - run: pnpm db:deploy
      - run: pnpm --filter @checkout/web exec playwright install --with-deps chromium
      - run: pnpm test:e2e
